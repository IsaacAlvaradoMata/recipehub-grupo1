services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
    networks:
      - internal
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  internal:
    driver: bridge